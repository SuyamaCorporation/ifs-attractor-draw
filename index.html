<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFSアトラクタフラクタル描画</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold text-center mb-4 text-purple-400">IFSアトラクタフラクタル描画</h1>
  <div class="flex flex-col lg:flex-row gap-4">
    <div class="flex-1">
      <canvas id="canvas" width="600" height="500"
        class="bg-gray-900 rounded-xl border border-gray-700 w-full"
        aria-label="IFSフラクタル描画キャンバス"></canvas>
      <div class="flex gap-2 mt-2">
        <button id="btnDraw" aria-label="描画開始"
          class="flex-1 bg-purple-700 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded-lg transition">
          描画
        </button>
        <button id="btnDownload" aria-label="PNG保存"
          class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition">
          保存
        </button>
      </div>
    </div>
    <div class="lg:w-64 space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-300 mb-1">プリセット</label>
        <select id="preset" aria-label="プリセット選択"
          class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-gray-100">
          <option value="fern">バーンズリーのシダ</option>
          <option value="sierpinski">シェルピンスキー三角形</option>
          <option value="dragon">ドラゴン曲線</option>
          <option value="tree">フラクタルツリー</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-300 mb-1">
          反復回数: <span id="iterLabel">100000</span>
        </label>
        <input type="range" id="iterations" min="1000" max="500000" step="1000" value="100000"
          aria-label="反復回数"
          class="w-full accent-purple-500">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-300 mb-1">
          点サイズ: <span id="sizeLabel">1.2</span>
        </label>
        <input type="range" id="pointSize" min="0.5" max="4" step="0.1" value="1.2"
          aria-label="点サイズ"
          class="w-full accent-purple-500">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-300 mb-1">
          色相: <span id="hueLabel">120</span>°
        </label>
        <input type="range" id="hue" min="0" max="360" value="120"
          aria-label="色相"
          class="w-full accent-purple-500">
      </div>
      <div id="statusBox" class="bg-gray-800 rounded-lg p-3 text-sm text-gray-300">
        <p>プリセットを選んで「描画」ボタンを押してください。</p>
      </div>
      <div class="text-xs text-gray-500 leading-relaxed">
        <p class="font-semibold text-gray-400 mb-1">IFSとは？</p>
        <p>確率的収縮写像の繰り返しで生成されるフラクタルアトラクタです。カオスゲームアルゴリズムを使用しています。</p>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusBox = document.getElementById('statusBox');

const PRESETS = {
  fern: {
    label: 'バーンズリーのシダ',
    transforms: [
      { a:0,    b:0,    c:0,    d:0.16, e:0,    f:0,    p:0.01 },
      { a:0.85, b:0.04, c:-0.04,d:0.85, e:0,    f:1.60, p:0.85 },
      { a:0.20, b:-0.26,c:0.23, d:0.22, e:0,    f:1.60, p:0.07 },
      { a:-0.15,b:0.28, c:0.26, d:0.24, e:0,    f:0.44, p:0.07 }
    ],
    xMin:-2.7, xMax:2.7, yMin:0, yMax:10
  },
  sierpinski: {
    label: 'シェルピンスキー三角形',
    transforms: [
      { a:0.5, b:0,   c:0,   d:0.5, e:0,   f:0,   p:0.33 },
      { a:0.5, b:0,   c:0,   d:0.5, e:0.5, f:0,   p:0.33 },
      { a:0.5, b:0,   c:0,   d:0.5, e:0.25,f:0.5, p:0.34 }
    ],
    xMin:0, xMax:1, yMin:0, yMax:1
  },
  dragon: {
    label: 'ドラゴン曲線',
    transforms: [
      { a:0.5,  b:-0.5, c:0.5,  d:0.5, e:0,  f:0,  p:0.5 },
      { a:-0.5, b:-0.5, c:0.5,  d:-0.5,e:1,  f:0,  p:0.5 }
    ],
    xMin:-0.5, xMax:1.5, yMin:-0.5, yMax:1.5
  },
  tree: {
    label: 'フラクタルツリー',
    transforms: [
      { a:0,    b:0,    c:0,    d:0.5,  e:0,    f:0,    p:0.05 },
      { a:0.42, b:-0.42,c:0.42, d:0.42, e:0,    f:0.2,  p:0.40 },
      { a:0.42, b:0.42, c:-0.42,d:0.42, e:0,    f:0.2,  p:0.40 },
      { a:0.1,  b:0,    c:0,    d:0.1,  e:0,    f:0.2,  p:0.15 }
    ],
    xMin:-0.6, xMax:0.6, yMin:0, yMax:0.6
  }
};

function applyTransform(t, x, y) {
  return { x: t.a*x + t.b*y + t.e, y: t.c*x + t.d*y + t.f };
}

function chooseTransform(transforms) {
  let r = Math.random(), cum = 0;
  for (const t of transforms) {
    cum += t.p;
    if (r < cum) return t;
  }
  return transforms[transforms.length - 1];
}

let animFrame = null;
function draw() {
  if (animFrame) cancelAnimationFrame(animFrame);
  const key = document.getElementById('preset').value;
  const preset = PRESETS[key];
  const iters = parseInt(document.getElementById('iterations').value);
  const pSize = parseFloat(document.getElementById('pointSize').value);
  const hue = parseInt(document.getElementById('hue').value);

  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#030712';
  ctx.fillRect(0, 0, W, H);

  const { xMin, xMax, yMin, yMax } = preset;
  const scaleX = W / (xMax - xMin);
  const scaleY = H / (yMax - yMin);

  let x = 0, y = 0;
  const BATCH = 5000;
  let done = 0;

  statusBox.innerHTML = `<p class="text-yellow-400">描画中... 0%</p>`;

  function step() {
    const end = Math.min(done + BATCH, iters);
    for (let i = done; i < end; i++) {
      const t = chooseTransform(preset.transforms);
      ({ x, y } = applyTransform(t, x, y));
      const px = (x - xMin) * scaleX;
      const py = H - (y - yMin) * scaleY;
      const alpha = 0.5 + Math.random() * 0.5;
      ctx.fillStyle = `hsla(${hue}, 80%, 65%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(px, py, pSize, 0, Math.PI * 2);
      ctx.fill();
    }
    done = end;
    const pct = Math.round(done / iters * 100);
    if (done < iters) {
      statusBox.innerHTML = `<p class="text-yellow-400">描画中... ${pct}%</p>`;
      animFrame = requestAnimationFrame(step);
    } else {
      statusBox.innerHTML = `<p class="text-green-400">完了: ${iters.toLocaleString()} 点描画</p><p class="text-gray-400 text-xs mt-1">${preset.label}</p>`;
    }
  }
  animFrame = requestAnimationFrame(step);
}

document.getElementById('btnDraw').addEventListener('click', draw);
document.getElementById('btnDownload').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'ifs-fractal.png';
  a.href = canvas.toDataURL();
  a.click();
});

['iterations','pointSize','hue'].forEach(id => {
  const el = document.getElementById(id);
  const label = document.getElementById(id === 'iterations' ? 'iterLabel' : id === 'pointSize' ? 'sizeLabel' : 'hueLabel');
  el.addEventListener('input', () => { label.textContent = el.value; });
});

draw();
</script>
</body>
</html>
